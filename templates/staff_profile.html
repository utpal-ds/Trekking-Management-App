{% extends "base.html" %}

{% block title %}My Profile - TrekManage{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <h2 class="fw-bold text-primary mb-4">Edit Profile</h2>

    <div class="card border-0 shadow-sm rounded-3" style="max-width: 600px;">
        <div class="card-body p-4">
            <form action="{{ url_for('staff.profile') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username (ReadOnly)</label>
                    <input type="text" class="form-control bg-light" id="username" value="{{ user.username }}" readonly>
                </div>
                
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                </div>
                
                <div class="mb-3">
                    <label for="contact_details" class="form-label fw-semibold">Contact Details</label>
                    <input type="text" class="form-control" id="contact_details" name="contact_details" value="{{ user.contact_details }}">
                </div>
                
                <button type="submit" class="btn btn-primary px-4 fw-bold">Update Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
